name: Publish to PyPI and the Code Genome Project

# on manually trigger
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Release scope
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  check:
    uses: ./.github/workflows/checks.yml
    secrets: inherit
  publish:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --all-extras --group ci --python 3.11

      - name: Bump version and commit change
        run: |
          source .venv/bin/activate
          semantic-release version --${{ github.event.inputs.scope }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          source .venv/bin/activate
          python -m build

      - name: Publish to the Code Genome Project
        env:
          TWINE_REPOSITORY_URL: https://artifacts.codegenomeproject.org/pypi/
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.CGP_PUBLISH_TOKEN }}
        run: |
          source .venv/bin/activate
          python -m twine upload dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          source .venv/bin/activate
          python -m twine upload dist/*
